<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>HealthApp - Zapotrzebowanie na wodę</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #444;
            line-height: 1.6;
        }

        h2, h3 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 8px;
            color: #555;
        }

        input[type="number"], button {
            width: 100%;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fff;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus, button:focus {
            outline: none;
            border-color: #ffcc00;
            box-shadow: 0 0 8px rgba(255, 204, 0, 0.6);
        }

        button {
            background-color: #333;
            color: white;
            cursor: pointer;
            border: none;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #ffcc00;
            color: #333;
        }

        .water-info {
            background-color: #ffffff;
            padding: 30px;
            margin: 20px auto;
            border-radius: 10px;
            max-width: 600px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .water-info h3 {
            margin-bottom: 15px;
            font-size: 22px;
        }

        .water-info span {
            font-weight: bold;
            color: #ffcc00;
            font-size: 20px;
        }

        .water-info p {
            font-size: 18px;
        }

        @media (max-width: 768px) {
            input[type="number"], button {
                width: 80%;
                margin-left: 10%;
            }

            .water-info {
                padding: 20px;
                margin: 20px 10px;
            }
        }
    </style>
</head>
<body>
<div th:replace="~{menu.html}"></div>

<div class="container">
    <h2>Zapotrzebowanie na wodę</h2>

    <div class="water-info">
        <label for="weight">Podaj swoją masę ciała (kg):</label>
        <input type="number" id="weight" name="weight" placeholder="Waga w kg" th:value="${weight}">
        <button id="calculateButton">Oblicz zapotrzebowanie</button>
    </div>

    <h3>Dzienne zapotrzebowanie: <span id="waterNeed" th:text="${waterNeed}">0</span> ml</h3>

    <div class="water-info">
        <h3>Dodaj spożycie płynów</h3>
        <label for="water-intake">Podaj ilość wypitej wody (ml):</label>
        <input type="number" id="water-intake" name="waterIntake" placeholder="Ilość ml">
        <button id="addWaterButton">Dodaj</button>
    </div>

    <h3>Łącznie wypita woda: <span id="totalWater" th:text="${totalWater}">0</span> ml</h3>
    <h3>Pozostało do wypicia: <span id="remainingWater" th:text="${remainingWater}">0</span> ml</h3>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
    $(document).ready(function() {
        $('#calculateButton').click(function() {
            var weight = $('#weight').val();

            $.ajax({
                type: 'POST',
                url: '/homeWater',
                data: { weight: weight },
                success: function(response) {
                    $('#waterNeed').text(response.waterNeed);
                    $('#remainingWater').text(response.remainingWater);
                },
                error: function() {
                    alert('Wystąpił błąd przy obliczaniu zapotrzebowania.');
                }
            });
        });

        $('#addWaterButton').click(function() {
            var waterIntake = $('#water-intake').val();

            $.ajax({
                type: 'POST',
                url: '/addWater',
                data: { waterIntake: waterIntake },
                success: function(response) {
                    $('#totalWater').text(response.totalWater);
                    $('#remainingWater').text(response.remainingWater);
                },
                error: function() {
                    alert('Wystąpił błąd przy dodawaniu spożytej wody.');
                }
            });
        });
    });
</script>
</body>
