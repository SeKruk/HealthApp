<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Twój Profil</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
    <style>
body {
    font-family: 'Roboto', sans-serif;
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #f8f9fa, #e9ecef);
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 45px;
    max-width: 810px;
    margin-left: auto;
    margin-right: auto;
    padding: 18px;
    background-color: #fff;
    border-radius: 10.5px;
    box-shadow: 0 3px 7.5px rgba(0, 0, 0, 0.1);
}

.profile-heading {
    font-size: 32.4px;
    font-weight: bold;
    color: #333;
    margin-bottom: 27px;
    text-align: center;
}

.section {
    margin-bottom: 20px;
    background-color: #fafafa;
    border-radius: 7.2px;
    padding: 12px;
    box-shadow: 0 1.8px 5.4px rgba(0, 0, 0, 0.1);
    display: flex;
    align-items: center;
    width: 100%;
    max-width: 750px;
    box-sizing: border-box;
}

.section-icon {
    font-size: 20px;
    margin-right: 18px;
    color: #007bff;
}

.section label {
    font-size: 20px;
    font-weight: bold;
    color: #555;
    margin-right: 12px;
    min-width: 100px;
    white-space: nowrap;
}


.section p {
    font-size: 21px;
    color: #333;
    padding: 6.9px;
    border-radius: 2.4px;
    flex-grow: 1;
    background-color: #f7f7f7;
    word-wrap: break-word;
    min-width: 150px;
    margin-left: 20px;
}

.section textarea {
    font-size: 19.8px;
    color: #333;
    padding: 14.4px;
    border-radius: 5.4px;
    width: 100%;
    background-color: #f7f7f7;
    height: 135px;
    border: 1.8px solid #ddd;
    transition: border 0.3s;
}

.section textarea:focus {
    border-color: #007bff;
    outline: none;
}

button {
    background-color: #007bff;
    color: white;
    padding: 14.4px 18px;
    border-radius: 7.2px;
    border: none;
    font-size: 19.8px;
    cursor: pointer;
    transition: background-color 0.3s ease;
    width: 100%;
}

button:hover {
    background-color: #0056b3;
}

.weight-section {
    display: flex;
    align-items: center;
    gap: 14.4px;
    padding: 14.4px;
    background-color: #f7f7f7;
    border-radius: 7.2px;
    margin-top: 18px;
    justify-content: space-between;
    width: 100%;
    max-width: 750px;
}

.weight-display {
    font-size: 16.2px;
    font-weight: bold;
    color: #007bff;
    background-color: #ffffff;
    padding: 5.4px 9px;
    border-radius: 5.4px;
    border: 1.8px solid #ccc;
    width: 54px;
    text-align: center;
}

.weight-form {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    justify-content: flex-start;
}

.weight-input {
    font-size: 18px;
    padding: 7.2px 10.8px;
    border: 1.8px solid #ccc;
    border-radius: 5.4px;
    width: 108px;
    text-align: center;
}

.weight-input:focus {
    border-color: #007bff;
    outline: none;
}

.weight-button {
    background-color: #007bff;
    color: white;
    padding: 7.2px 10.8px;
    border-radius: 5.4px;
    border: none;
    font-size: 16.2px;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.weight-button:hover {
    background-color: #0056b3;
}

@media (max-width: 768px) {
    .container {
        padding: 18px;
    }

    .profile-heading {
        font-size: 25.2px;
    }

    .section label {
        font-size: 18px;
    }

    button {
        font-size: 16.2px;
    }

    .weight-section {
        flex-direction: column;
        gap: 9px;
        padding: 18px;
    }

    .weight-input {
        width: 100%;
    }

    .weight-button {
        width: 100%;
    }
}


    </style>
</head>
<body>
<div th:replace="~{menu.html}"></div>

<div class="container">

    <h2 class="profile-heading">Twój Profil</h2>


    <div class="section">
        <div class="section-icon">👤</div>
        <label>Imię: </label>
        <p th:text="${user.name}"></p>
    </div>


    <div class="section">
        <div class="section-icon">👥</div>
        <label>Nazwisko: </label>
        <p th:text="${user.surname}"></p>
    </div>

    <div class="section">
        <div class="section-icon">📧</div>
        <label>Email:</label>
        <p th:text="${user.email}"></p>
    </div>

    <div class="section weight-section">
        <div class="section-icon">⚖️</div>
        <label>Waga (kg):</label>
        <p class="weight-display" th:text="${user.weight} + ' kg'"></p>

        <form action="/updateWeight" method="post" class="weight-form">
            <input type="number" name="weight" class="weight-input" placeholder="Nowa waga" step="0.1" required>
            <button type="submit" class="weight-button">✔</button>
        </form>
    </div>

    <div class="section">
        <div class="section-icon">📝</div>
        <label>Opis profilu:</label>

        <form method="post" action="/updateDescription">
            <textarea name="profileDescription" class="form-control" rows="3" placeholder="Wpisz opis..." th:text="${user.Description}"></textarea>
            <button type="submit">Zapisz</button>
        </form>
    </div>
</div>
