<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>HealthApp - Lunch Recipes</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
    <style>
        #searchForm {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        #searchForm input[type="text"], #searchForm input[type="date"], #searchForm input[type="submit"] {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
        }

        .grid-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
            justify-content: space-between;
        }

        .grid-item {
            background-color: #f0f0f0;
            border: 2px solid black;
            box-sizing: border-box;
            width: calc(25% - 20px);
            height: 500px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .grid-item img {
            width: 100%;
            height: 75%;
            object-fit: cover;
            position: absolute;
            top: 12.5%;
            left: 0;
        }

        .text-box {
            background-color: #ddd;
            width: 100%;
            height: 12.5%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 5px;
            border-top: 1px solid #aaa;
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .calories-box {
            background-color: #ddd;
            width: 100%;
            height: 12.5%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 5px;
            border-bottom: 1px solid #aaa;
            position: absolute;
            top: 0;
            left: 0;

        }
    </style>
</head>
<body>
<div th:replace="~{menu.html}"></div>

<div class="grid-container">
    <div th:each="recipe : ${recipes}" class="grid-item">
        <div class="calories-box">
            <h3 th:text="${recipe.calories != null ? #numbers.formatInteger(recipe.calories, 0, 'COMMA') + ' kcal / porcja' : 'Brak danych'}"></h3>
        </div>
        <a th:href="@{'/recipe/' + ${recipe.id}}">
            <img th:src="${recipe.imageUrl}" alt="Obrazek">
        </a>
        <div class="text-box">
            <h3 th:text="${recipe.title}"></h3>
        </div>
    </div>
</div>
</body>
</html>
