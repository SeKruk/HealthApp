<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>HealthApp - Recipe Details</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
    <style>
        .recipe-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        .recipe-image {
            width: 100%;
            height: auto;
            max-height: 400px;
            object-fit: cover;
            margin-bottom: 20px;
        }

        .recipe-title {
            font-size: 2em;
            margin-bottom: 20px;
        }

        .recipe-description {
            font-size: 1.2em;
            line-height: 1.6;
        }
         .recipe-ingredients {
            font-size: 1.2em;
            line-height: 1.6;
            text-align: left;
            white-space: pre-line;
            margin: 20px 0;
        }
         .recipe-source {
            font-size: 1.2em;
            line-height: 1.6;
            text-align: left;
            margin: 20px 0;

       }

    </style>
</head>
<body>
<div th:replace="~{menu.html}"></div>

<div class="recipe-container">
    <h1 class="recipe-title" th:text="${recipe.title}"></h1>
    <img th:src="${recipe.imageUrl}" alt="Recipe Image" class="recipe-image">
    <h2>Składniki:</h2>
    <p class="recipe-ingredients" th:text="${recipe.ingredients}"></p>
    <h2>Instrukcja:</h2>
    <p class="recipe-description" th:text="${recipe.description}"></p>
    <h2>Źródło:</h2>
    <p class="recipe-source" th:text="${recipe.source}"></p>
</div>

</body>
</html>
